[project]
name = "unitree-g1-rl"
version = "1.0.0"
description = "Unitree G1 人形机器人强化学习入门教程 — 从零到行走"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "GXMZU-AITECC" },
]

[project.optional-dependencies]
notebooks = ["gymnasium", "numpy", "torch", "matplotlib", "jupyter"]
training = ["rsl-rl-lib==5.0.1", "gymnasium"]

[tool.ruff]
line-length = 100
target-version = "py310"
